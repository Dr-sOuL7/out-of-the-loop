name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate content files
        run: python -c "import sys; sys.path.insert(0,'src'); from ootl.content.importer import validate_content; p=validate_content(); print(p or 'content OK'); sys.exit(1 if p else 0)"
      - name: Run tests
        run: pytest -q

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t out-of-the-loop:ci .
